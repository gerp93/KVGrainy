[package]
name = "kvgrainy-core"
description = "Fit an image under a size limit with the best quality possible"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
moxcms = "0.9"
mozjpeg = "0.10"
webp = "0.3"
rayon = "1"
thiserror = "2"
fast_image_resize = "5"
ravif = "0.13"
avif-decode = { version = "1.0.2", default-features = false }
ssimulacra2 = "0.5"
imgref = "1"
rgb = "0.8"
