name: Bug report
description: "Something is broken: an error, a crash, a page that does not work."
labels: ["bug"]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options: [Web tool, Desktop app, Command line, Website content]
    validations: { required: true }
  - type: input
    id: system
    attributes:
      label: Browser or app version, and system
      placeholder: "Safari 19 on iPhone, or KVGrainy 1.0.30 on Windows 11"
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: What did you do, what happened, and what did you expect?
      description: Include any error message exactly as shown. Please do not attach a private photo.
    validations: { required: true }
