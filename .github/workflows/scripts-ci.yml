name: Scripts CI

# The Python tooling (release manifests, the CI gate used by releases and deploys), and the syntax of the
# Windows-only PowerShell scripts that no Linux test run executes. Standard library only.
on:
  pull_request:
    paths: ["scripts/**", "tests/**", "desktop/e2e/*.ps1", "desktop/src-tauri/tauri*.json", ".github/workflows/*.yml"]
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**", "desktop/e2e/*.ps1", "desktop/src-tauri/tauri*.json", ".github/workflows/*.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      # A typo in a Windows-only script otherwise surfaces only after a ten-minute desktop run (one already did).
      - name: Parse the PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem -Path desktop/e2e -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) {
              "::error file=$($file.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $failed = $true
            }
            "$($file.Name): $(@($errors).Count) syntax error(s)"
          }
          if ($failed) { exit 1 }
