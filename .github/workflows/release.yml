name: Build and Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      new_version: ${{ steps.tag_version.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump semantic version and create tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          # TEMPORARY: force this one release to 1.0.0. Remove this line
          # in the very next commit so future pushes resume normal
          # Conventional-Commits-driven auto-bumping from v1.0.0 onward.
          custom_tag: "1.0.0"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: KVGrainy-linux
            dist_name: KVGrainy
          - os: windows-latest
            asset_name: KVGrainy-windows.exe
            dist_name: KVGrainy.exe
          - os: macos-latest
            asset_name: KVGrainy-macos
            dist_name: KVGrainy
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (Windows/macOS)
        if: runner.os != 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tk for system Python (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Write version file
        shell: bash
        run: echo "__version__ = \"${{ needs.version.outputs.new_version }}\"" > _version.py

      - name: Build executable
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            SEP=";"
          else
            SEP=":"
          fi
          python -m PyInstaller --noconfirm --onefile --windowed --name KVGrainy \
            --add-data "LICENSE${SEP}." gui.py

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p release_out
          cp "dist/${{ matrix.dist_name }}" "release_out/${{ matrix.asset_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: release_out/${{ matrix.asset_name }}

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release_assets
          find artifacts -type f -exec cp {} release_assets/ \;
          ls -la release_assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.new_tag }}
          name: KVGrainy ${{ needs.version.outputs.new_version }}
          target_commitish: ${{ github.sha }}
          files: release_assets/*
          generate_release_notes: true
