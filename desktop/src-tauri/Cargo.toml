[package]
name = "kvgrainy-desktop"
description = "KVGrainy desktop app: a Tauri shell around the shared web UI, running kvgrainy-core natively"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/gerp93/KVGrainy"
publish = false

# Detached from the root workspace on purpose: Tauri needs system libraries (WebKitGTK on Linux)
# that the root workspace's Rust CI does not install. Build it with `npm run tauri build` in desktop/.
[workspace]

[lib]
name = "kvgrainy_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kvgrainy-core = { path = "../../crates/kvgrainy-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Same as the root workspace: the codecs are far too slow unoptimized, even for development.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
