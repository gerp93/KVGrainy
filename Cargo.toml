[workspace]
members = ["crates/kvgrainy-core", "crates/kvgrainy-cli", "crates/kvgrainy-wasm-spike", "crates/kvgrainy-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/gerp93/KVGrainy"

# Dependencies (mozjpeg, image, lanczos resize) are far too slow unoptimized for tests.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

# The browser build: size matters more than the last few percent of speed, and a panic can only abort anyway.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
