[workspace]
members = ["crates/kvgrainy-core", "crates/kvgrainy-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/gerp93/KVGrainy"

# Dependencies (mozjpeg, image, lanczos resize) are far too slow unoptimized for tests.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
